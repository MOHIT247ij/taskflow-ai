# One-command local stack:  docker compose up --build
# Then run the frontend with:  cd client && npm run dev
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]

  api:
    build: ./server
    restart: unless-stopped
    depends_on: [mongo]
    ports: ["5000:5000"]
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/taskflow_ai
      JWT_SECRET: please_change_me_in_real_deployments
      CLIENT_URL: http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

volumes:
  mongo_data:
