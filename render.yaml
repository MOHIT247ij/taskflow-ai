# Render Blueprint — one web service serves both the API and the built React app (same origin, no CORS setup)
services:
  - type: web
    name: taskflow-ai
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --prefix server && npm install --include=dev --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # optional
      - key: CLIENT_URL
        value: http://localhost:5173
